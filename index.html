<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitify - Fitness App</title>
<meta name="description" content="Fitify is an exercise and workout library with exercises by muscle group, equipment and difficulty.">
<style>
:root{
  --bg:#090b0d;
  --card:#151922;
  --card2:#1c2230;
  --text:#f5f7fa;
  --muted:#9ca6b5;
  --accent:#5ee35d;
  --line:#282f3a;
  --danger:#ff6262;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(9,11,13,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

nav{
  max-width:1150px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo span{
  color:var(--accent);
}

.navlinks{
  display:flex;
  gap:20px;
  font-size:14px;
  color:var(--muted);
}

.navlinks a:hover{
  color:var(--accent);
}

main{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 70px;
}

.hero{
  padding:25px 0 20px;
}

.hero h1{
  font-size:clamp(30px,6vw,54px);
  line-height:1.1;
  margin-bottom:12px;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  color:var(--muted);
  max-width:650px;
  line-height:1.6;
}

.searchbox{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.searchbox input{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#141923;
  color:white;
  outline:none;
  font-size:15px;
}

.searchbox input:focus{
  border-color:var(--accent);
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:var(--accent);
  color:#061006;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.08);
}

.section{
  margin-top:30px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.section-title h2{
  font-size:21px;
}

.muscles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
}

.muscle{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  cursor:pointer;
  transition:.2s;
  text-align:center;
}

.muscle:hover, .muscle.active{
  border-color:var(--accent);
  background:var(--card2);
  transform:translateY(-2px);
}

.muscle b{
  display:block;
  margin-bottom:5px;
}

.muscle small{
  color:var(--muted);
}

.exercises{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.exercise{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
  display:flex;
  flex-direction:column;
}

.exercise:hover{
  transform:translateY(-3px);
  border-color:#3b4658;
}

.clickable-area {
  cursor: pointer;
}

.exercise-image{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
  background:#202633;
}

.image-fallback{
  height:180px;
  background:linear-gradient(135deg,#171c25,#293241);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  font-size:20px;
  font-weight:800;
}

.exercise-body{
  padding:16px;
  flex:1;
  display:flex;
  flex-direction:column;
}

.exercise h3{
  font-size:18px;
  margin-bottom:5px;
  color:var(--text);
}

.play-badge {
  display:inline-block;
  font-size:12px;
  color:var(--accent);
  margin-bottom:8px;
  font-weight:bold;
}

.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.sets{
  margin-top:8px;
  font-weight:700;
  font-size:13px;
  color:var(--accent);
}

.desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-top:8px;
  flex:1;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions button{
  flex:1;
  font-size:12px;
  padding:9px 8px;
}

.favorite{
  background:#303744;
  color:white;
}

.workout-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.workout-item small{
  color:var(--muted);
}

.empty{
  color:var(--muted);
  padding:20px 0;
}

footer{
  text-align:center;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding:25px;
  font-size:13px;
}

@media(max-width:650px){
  .exercises{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .exercise-image, .image-fallback{
    height:130px;
  }
  .exercise-body{
    padding:10px;
  }
  .actions{
    flex-direction:column;
  }
}

@media(max-width:400px){
  .exercises{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<header>
<nav>
  <div class="logo">Fit<span>ify</span></div>
  <div class="navlinks">
    <a href="#exercises">Exercises</a>
    <a href="#workout">Workout</a>
  </div>
</nav>
</header>

<main>
<section class="hero">
  <h1>Train smarter.<br><span>Get stronger.</span></h1>
  <p>Muscle group choose karein aur kisi bhi exercise par tap karke uska tutorial video dekhein.</p>

  <div class="searchbox">
    <input id="search" type="search" placeholder="Search exercise (e.g. Bench Press)" oninput="filterExercises()">
    <button onclick="filterExercises()">Search</button>
  </div>
</section>

<section class="section">
  <div class="section-title">
    <h2>Muscle Groups</h2>
  </div>
  <div class="muscles" id="muscles"></div>
</section>

<section class="section" id="exercises">
  <div class="section-title">
    <h2 id="currentCategory">All Exercises</h2>
    <button onclick="showAll()">Show All</button>
  </div>
  <div class="exercises" id="exerciseList"></div>
</section>

<section class="section" id="workout">
  <div class="section-title">
    <h2>My Workout Routine</h2>
    <button onclick="clearWorkout()" style="background:var(--danger); color:white;">Clear</button>
  </div>
  <div id="workoutList"></div>
</section>
</main>

<footer>
© 2026 Fitify • Personal Fitness Companion
</footer>

<script>
const exercises = [
  { name:"Bench Press", muscle:"Chest", equipment:"Barbell", level:"Intermediate", sets:"3 × 8–12", image:"https://images.unsplash.com/photo-1581009146145-b5ef050c2e1a?auto=format&fit=crop&w=900&q=80", desc:"Press the bar from your chest while keeping your body stable." },
  { name:"Push-Up", muscle:"Chest", equipment:"Bodyweight", level:"Beginner", sets:"3 × 8–15", image:"https://images.unsplash.com/photo-1598971639058-fab3c3109a00?auto=format&fit=crop&w=900&q=80", desc:"Keep your body in a straight line and lower your chest with control." },
  { name:"Incline Dumbbell Press", muscle:"Chest", equipment:"Dumbbell", level:"Intermediate", sets:"3 × 10–12", image:"https://images.unsplash.com/photo-1534367507873-d2d7e24c797f?auto=format&fit=crop&w=900&q=80", desc:"Targets upper chest using an inclined bench." },
  { name:"Lat Pulldown", muscle:"Back", equipment:"Cable", level:"Beginner", sets:"3 × 8–12", image:"https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=80", desc:"Pull the bar toward your upper chest with control." },
  { name:"Barbell Row", muscle:"Back", equipment:"Barbell", level:"Intermediate", sets:"3 × 8–12", image:"https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=900&q=80", desc:"Hinge at the hips and pull the bar toward your torso." },
  { name:"Shoulder Press", muscle:"Shoulders", equipment:"Dumbbell", level:"Intermediate", sets:"3 × 8–12", image:"https://images.unsplash.com/photo-1599058917212-d750089bc07e?auto=format&fit=crop&w=900&q=80", desc:"Press the dumbbells overhead while maintaining control." },
  { name:"Lateral Raise", muscle:"Shoulders", equipment:"Dumbbell", level:"Beginner", sets:"3 × 12–15", image:"https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=900&q=80", desc:"Raise the dumbbells out to your sides with control." },
  { name:"Biceps Curl", muscle:"Biceps", equipment:"Dumbbell", level:"Beginner", sets:"3 × 10–15", image:"https://images.unsplash.com/photo-1581009146145-b5ef050c2e1a?auto=format&fit=crop&w=900&q=80", desc:"Curl the weights while keeping your elbows stable." },
  { name:"Triceps Pushdown", muscle:"Triceps", equipment:"Cable", level:"Beginner", sets:"3 × 10–15", image:"https://images.unsplash.com/photo-1530822847156-5df6846166b3?auto=format&fit=crop&w=900&q=80", desc:"Extend your elbows while keeping your upper arms stable." },
  { name:"Goblet Squat", muscle:"Legs", equipment:"Dumbbell", level:"Beginner", sets:"3 × 8–12", image:"https://images.unsplash.com/photo-1574680178050-55c6a6c96e8f?auto=format&fit=crop&w=900&q=80", desc:"Squat with a dumbbell held close to your chest." },
  { name:"Romanian Deadlift", muscle:"Legs", equipment:"Barbell", level:"Intermediate", sets:"3 × 8–12", image:"https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=900&q=80", desc:"Hinge at the hips and keep your back neutral." },
  { name:"Plank", muscle:"Abs", equipment:"Bodyweight", level:"Beginner", sets:"3 × 20–60 sec", image:"https://images.unsplash.com/photo-1566241142559-40e1dab266c6?auto=format&fit=crop&w=900&q=80", desc:"Brace your core and maintain a straight body position." },
  { name:"Calf Raise", muscle:"Calves", equipment:"Bodyweight", level:"Beginner", sets:"3 × 12–20", image:"https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=900&q=80", desc:"Rise onto your toes slowly and lower with control." }
];

let workout = JSON.parse(localStorage.getItem("fitifyWorkout") || "[]");
let activeGroup = "All";

const groups = [...new Set(exercises.map(e => e.muscle))];

function renderMuscles(){
  document.getElementById("muscles").innerHTML = groups.map(group => {
    const count = exercises.filter(e => e.muscle === group).length;
    const isActive = activeGroup === group ? 'active' : '';
    return `
      <div class="muscle ${isActive}" onclick="filterBy('${group}')">
        <b>${group}</b>
        <small>${count} exercises</small>
      </div>
    `;
  }).join("");
}

function render(list = exercises){
  const container = document.getElementById("exerciseList");
  if(!list.length){
    container.innerHTML = `<div class="empty">Koi exercise nahi mili.</div>`;
    return;
  }

  container.innerHTML = list.map((e) => {
    const originalIndex = exercises.findIndex(ex => ex.name === e.name);
    return `
      <article class="exercise">
        <div class="clickable-area" onclick="openYouTube('${e.name}')" title="Click to watch ${e.name} video on YouTube">
          <img 
            class="exercise-image" 
            src="${e.image}" 
            alt="${e.name}" 
            loading="lazy" 
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
          >
          <div class="image-fallback" style="display:none">${e.name}</div>
        </div>

        <div class="exercise-body">
          <div class="clickable-area" onclick="openYouTube('${e.name}')">
            <h3>${e.name}</h3>
            <span class="play-badge">▶ Watch Video Guide</span>
          </div>

          <div class="meta">${e.muscle} • ${e.equipment} • ${e.level}</div>
          <div class="sets">${e.sets}</div>
          <div class="desc">${e.desc}</div>

          <div class="actions">
            <button onclick="addWorkout(${originalIndex})">+ Add Routine</button>
            <button class="favorite" onclick="favorite('${e.name}')">★ Favorite</button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function filterBy(group){
  activeGroup = group;
  renderMuscles();
  document.getElementById("currentCategory").innerText = group + " Exercises";
  const result = exercises.filter(e => e.muscle === group);
  render(result);
  document.getElementById("exercises").scrollIntoView({ behavior:"smooth" });
}

function filterExercises(){
  const q = document.getElementById("search").value.toLowerCase().trim();
  if(!q){
    activeGroup = "All";
    renderMuscles();
    document.getElementById("currentCategory").innerText = "All Exercises";
    render(exercises);
    return;
  }
  const result = exercises.filter(e => 
    e.name.toLowerCase().includes(q) || 
    e.muscle.toLowerCase().includes(q) || 
    e.equipment.toLowerCase().includes(q)
  );
  render(result);
}

function showAll(){
  activeGroup = "All";
  renderMuscles();
  document.getElementById("search").value = "";
  document.getElementById("currentCategory").innerText = "All Exercises";
  render(exercises);
  document.getElementById("exercises").scrollIntoView({ behavior:"smooth" });
}

function openYouTube(exerciseName){
  const query = encodeURIComponent(exerciseName + " exercise tutorial form");
  window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
}

function addWorkout(index){
  const exercise = exercises[index];
  if(!workout.includes(exercise.name)){
    workout.push(exercise.name);
    saveWorkout();
    renderWorkout();
  } else {
    alert(exercise.name + " aapke workout list me pehle se shamil hai.");
  }
}

function removeWorkout(name){
  workout = workout.filter(item => item !== name);
  saveWorkout();
  renderWorkout();
}

function clearWorkout(){
  workout = [];
  saveWorkout();
  renderWorkout();
}

function saveWorkout(){
  localStorage.setItem("fitifyWorkout", JSON.stringify(workout));
}

function renderWorkout(){
  const box = document.getElementById("workoutList");
  if(!workout.length){
    box.innerHTML = `<div class="empty">Aapka workout list khaali hai. Library se exercises add karein.</div>`;
    return;
  }

  box.innerHTML = workout.map(name => {
    const ex = exercises.find(e => e.name === name);
    return `
      <div class="workout-item">
        <div>
          <b>${name}</b><br>
          <small>${ex ? ex.muscle + " • " + ex.sets : ""}</small>
        </div>
        <button onclick="removeWorkout('${name}')" style="background:var(--danger);color:white">Remove</button>
      </div>
    `;
  }).join("");
}

function favorite(name){
  alert(name + " saved as favorite!");
}

renderMuscles();
render();
renderWorkout();
</script>
</body>
</html>

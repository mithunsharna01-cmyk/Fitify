<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitify - Workout & Exercise Guide</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b0f14;
    color:#fff;
}

header{
    background:#111820;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #27313d;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#55e39a;
}

.nav-text{
    color:#9ba8b8;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 18px 60px;
}

.hero{
    padding:25px 0;
}

.hero h1{
    font-size:clamp(38px,7vw,60px);
    margin-bottom:12px;
}

.hero h1 span{
    color:#55e39a;
}

.hero p{
    color:#9ba8b8;
    line-height:1.6;
    max-width:650px;
}

.search{
    margin:20px 0;
}

.search input{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #293544;
    background:#121923;
    color:white;
    font-size:16px;
    outline:none;
}

.search input:focus{
    border-color:#55e39a;
}

.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:5px 0 18px;
}

.category{
    white-space:nowrap;
    padding:10px 15px;
    border-radius:30px;
    border:1px solid #293544;
    background:#121923;
    color:white;
    cursor:pointer;
}

.category.active{
    background:#55e39a;
    color:#06120c;
    border-color:#55e39a;
    font-weight:bold;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:15px 0;
}

.section-title h2{
    font-size:25px;
}

.count{
    color:#9ba8b8;
    font-size:14px;
}

.exercise-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.exercise-card{
    background:#121923;
    border:1px solid #293544;
    border-radius:16px;
    padding:18px;
    transition:0.2s;
}

.exercise-card:hover{
    transform:translateY(-3px);
    border-color:#55e39a;
}

.badge{
    display:inline-block;
    padding:6px 9px;
    border-radius:8px;
    background:#192431;
    color:#55e39a;
    font-size:12px;
    margin-bottom:12px;
}

.exercise-card h3{
    margin-bottom:10px;
    font-size:19px;
}

.info{
    color:#9ba8b8;
    font-size:14px;
    line-height:1.7;
}

button{
    cursor:pointer;
}

.add-btn{
    width:100%;
    margin-top:15px;
    padding:11px;
    border-radius:10px;
    border:1px solid #293544;
    background:#192431;
    color:white;
}

.add-btn:hover{
    background:#55e39a;
    color:#06120c;
}

.no-result{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#9ba8b8;
}

/* MODAL */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:200;
    padding:20px;
    overflow:auto;
}

.modal{
    max-width:600px;
    margin:5vh auto;
    background:#121923;
    border:1px solid #293544;
    border-radius:18px;
    padding:25px;
}

.close{
    float:right;
    background:#192431;
    border:0;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    font-size:18px;
}

.modal h2{
    margin:35px 0 15px;
    font-size:28px;
}

.modal p{
    color:#b4bfcc;
    line-height:1.7;
    margin:10px 0;
}

.modal strong{
    color:white;
}

/* WORKOUT */

.workout{
    margin-top:40px;
    padding:20px;
    border-radius:16px;
    background:#121923;
    border:1px solid #293544;
}

.workout h2{
    margin-bottom:10px;
}

.workout-list{
    margin-top:15px;
}

.workout-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #293544;
}

.remove{
    background:#192431;
    border:0;
    color:#ff8f8f;
    padding:7px 10px;
    border-radius:7px;
}

/* MOBILE */

@media(max-width:800px){
    .exercise-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){
    .container{
        padding:18px 13px 50px;
    }

    .exercise-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:42px;
    }
}
</style>
</head>

<body>

<header>
<div class="nav">
    <div class="logo">Fit<span>ify</span></div>
    <div class="nav-text">Workout Library</div>
</div>
</header>

<main class="container">

<section class="hero">
    <h1>Train <span>Smarter.</span></h1>
    <p>
        Explore exercises by muscle group, search exercises,
        and create your own workout routine with Fitify.
    </p>
</section>

<div class="search">
    <input
        type="search"
        id="search"
        placeholder="Search exercises... e.g. Push Up, Squat"
    >
</div>

<div class="categories" id="categories"></div>

<div class="section-title">
    <h2>Exercises</h2>
    <div class="count" id="count"></div>
</div>

<div class="exercise-grid" id="exerciseGrid"></div>

<section class="workout">
    <h2>🏋️ My Workout</h2>
    <p style="color:#9ba8b8">
        Exercises you add will appear here.
    </p>

    <div class="workout-list" id="workoutList"></div>
</section>

</main>

<!-- MODAL -->

<div class="modal-bg" id="modalBg">

<div class="modal">

<button class="close" onclick="closeModal()">✕</button>

<div id="modalContent"></div>

</div>

</div>

<script>

const muscles = [
    "All",
    "Chest",
    "Back",
    "Shoulders",
    "Biceps",
    "Triceps",
    "Legs",
    "Glutes",
    "Abs",
    "Calves",
    "Forearms"
];

const exercises = [

{
name:"Push-Up",
muscle:"Chest",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 8–15",
rest:"60 sec",
description:"Keep your body straight, lower yourself with control and push back up."
},

{
name:"Bench Press",
muscle:"Chest",
equipment:"Barbell",
level:"Intermediate",
sets:"3 × 6–10",
rest:"90 sec",
description:"Keep your feet stable and control the bar throughout the movement."
},

{
name:"Incline Dumbbell Press",
muscle:"Chest",
equipment:"Dumbbells",
level:"Intermediate",
sets:"3 × 8–12",
rest:"90 sec",
description:"Press the dumbbells upward while maintaining a comfortable range of motion."
},

{
name:"Pull-Up",
muscle:"Back",
equipment:"Bodyweight",
level:"Intermediate",
sets:"3 × 5–10",
rest:"90 sec",
description:"Pull yourself upward with control and avoid excessive swinging."
},

{
name:"Lat Pulldown",
muscle:"Back",
equipment:"Cable",
level:"Beginner",
sets:"3 × 8–12",
rest:"75 sec",
description:"Pull the bar toward your upper chest while keeping your movement controlled."
},

{
name:"One Arm Dumbbell Row",
muscle:"Back",
equipment:"Dumbbell",
level:"Beginner",
sets:"3 × 8–12",
rest:"75 sec",
description:"Keep your torso stable and pull the elbow toward your side."
},

{
name:"Overhead Press",
muscle:"Shoulders",
equipment:"Dumbbells",
level:"Intermediate",
sets:"3 × 6–10",
rest:"90 sec",
description:"Brace your core and press the weights upward smoothly."
},

{
name:"Lateral Raise",
muscle:"Shoulders",
equipment:"Dumbbells",
level:"Beginner",
sets:"3 × 10–15",
rest:"60 sec",
description:"Use controlled movement and comfortable resistance."
},

{
name:"Biceps Curl",
muscle:"Biceps",
equipment:"Dumbbells",
level:"Beginner",
sets:"3 × 8–15",
rest:"60 sec",
description:"Keep your elbows close to your body and avoid swinging."
},

{
name:"Hammer Curl",
muscle:"Biceps",
equipment:"Dumbbells",
level:"Beginner",
sets:"3 × 8–15",
rest:"60 sec",
description:"Keep your wrists neutral and perform the movement slowly."
},

{
name:"Triceps Pushdown",
muscle:"Triceps",
equipment:"Cable",
level:"Beginner",
sets:"3 × 8–15",
rest:"60 sec",
description:"Keep your elbows close to your body and control the return."
},

{
name:"Close Grip Push-Up",
muscle:"Triceps",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 8–15",
rest:"60 sec",
description:"Maintain a stable body position and keep your elbows controlled."
},

{
name:"Bodyweight Squat",
muscle:"Legs",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 10–15",
rest:"60 sec",
description:"Keep your feet stable and move through a comfortable range."
},

{
name:"Goblet Squat",
muscle:"Legs",
equipment:"Dumbbell",
level:"Beginner",
sets:"3 × 8–12",
rest:"75 sec",
description:"Hold the weight close to your chest and keep your torso controlled."
},

{
name:"Romanian Deadlift",
muscle:"Legs",
equipment:"Dumbbells",
level:"Intermediate",
sets:"3 × 8–12",
rest:"90 sec",
description:"Hinge at the hips while keeping your spine in a neutral position."
},

{
name:"Glute Bridge",
muscle:"Glutes",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 10–15",
rest:"60 sec",
description:"Lift through your hips and pause briefly at the top."
},

{
name:"Calf Raise",
muscle:"Calves",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 12–20",
rest:"45 sec",
description:"Move slowly through a comfortable range of motion."
},

{
name:"Plank",
muscle:"Abs",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 20–45 sec",
rest:"45 sec",
description:"Keep your body aligned and breathe normally."
},

{
name:"Dead Bug",
muscle:"Abs",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 8–12 / side",
rest:"45 sec",
description:"Move slowly while keeping your core controlled."
},

{
name:"Wrist Curl",
muscle:"Forearms",
equipment:"Dumbbell",
level:"Beginner",
sets:"3 × 10–15",
rest:"45 sec",
description:"Use light resistance and controlled wrist movement."
}

];

let selectedMuscle = "All";

const categoryContainer =
document.getElementById("categories");

const grid =
document.getElementById("exerciseGrid");

const search =
document.getElementById("search");

const count =
document.getElementById("count");

const workoutList =
document.getElementById("workoutList");

const modalBg =
document.getElementById("modalBg");

const modalContent =
document.getElementById("modalContent");


/* CREATE CATEGORIES */

muscles.forEach(muscle => {

    const button =
    document.createElement("button");

    button.className =
    "category" +
    (muscle === "All" ? " active" : "");

    button.textContent = muscle;

    button.onclick = () => {

        selectedMuscle = muscle;

        document
        .querySelectorAll(".category")
        .forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        renderExercises();

    };

    categoryContainer.appendChild(button);

});


/* RENDER EXERCISES */

function renderExercises(){

    const query =
    search.value.toLowerCase().trim();

    const filtered =
    exercises.filter(exercise => {

        const muscleMatch =
        selectedMuscle === "All" ||
        exercise.muscle === selectedMuscle;

        const searchMatch =
        (
            exercise.name +
            " " +
            exercise.muscle +
            " " +
            exercise.equipment
        )
        .toLowerCase()
        .includes(query);

        return muscleMatch && searchMatch;

    });

    count.textContent =
    filtered.length + " exercises";

    if(filtered.length === 0){

        grid.innerHTML =
        `<div class="no-result">
        No exercises found.<br>
        Try another search or muscle group.
        </div>`;

        return;
    }

    grid.innerHTML = "";

    filtered.forEach(exercise => {

        const card =
        document.createElement("div");

        card.className =
        "exercise-card";

        card.innerHTML = `

        <span class="badge">
            ${exercise.muscle}
        </span>

        <h3>
            ${exercise.name}
        </h3>

        <div class="info">

            Equipment:
            ${exercise.equipment}

            <br>

            Level:
            ${exercise.level}

            <br>

            ${exercise.sets}

            · Rest ${exercise.rest}

        </div>

        <button class="add-btn">
            ＋ Add to My Workout
        </button>

        `;

        card.onclick = () =>
        showDetails(exercise);

        card.querySelector(".add-btn")
        .onclick = (event) => {

            event.stopPropagation();

            addToWorkout(exercise.name);

        };

        grid.appendChild(card);

    });

}


/* SEARCH */

search.addEventListener(
    "input",
    renderExercises
);


/* DETAILS */

function showDetails(exercise){

    modalContent.innerHTML = `

        <span class="badge">
            ${exercise.muscle}
        </span>

        <h2>
            ${exercise.name}
        </h2>

        <p>
            <strong>Equipment:</strong>
            ${exercise.equipment}
        </p>

        <p>
            <strong>Level:</strong>
            ${exercise.level}
        </p>

        <p>
            <strong>Suggested Sets & Reps:</strong>
            ${exercise.sets}
        </p>

        <p>
            <strong>Rest:</strong>
            ${exercise.rest}
        </p>

        <p>
            <strong>How to perform:</strong><br>
            ${exercise.description}
        </p>

        <p>
            <strong>Safety:</strong><br>
            Use controlled movement and comfortable
            resistance. Stop if you feel sharp pain
            or feel unwell.
        </p>

    `;

    modalBg.style.display = "block";
}


/* CLOSE MODAL */

function closeModal(){

    modalBg.style.display = "none";

}

modalBg.onclick = function(event){

    if(event.target === modalBg){

        closeModal();

    }

};


/* MY WORKOUT */

function getWorkout(){

    return JSON.parse(
        localStorage.getItem("fitifyWorkout") || "[]"
    );

}


function addToWorkout(name){

    let workout =
    getWorkout();

    if(!workout.includes(name)){

        workout.push(name);

        localStorage.setItem(
            "fitifyWorkout",
            JSON.stringify(workout)
        );

        renderWorkout();

        alert(
            name +
            " added to My Workout!"
        );

    }else{

        alert(
            "This exercise is already in My Workout."
        );

    }

}


function removeFromWorkout(name){

    let workout =
    getWorkout();

    workout =
    workout.filter(
        exercise => exercise !== name
    );

    localStorage.setItem(
        "fitifyWorkout",
        JSON.stringify(workout)
    );

    renderWorkout();

}


function renderWorkout(){

    const workout =
    getWorkout();

    if(workout.length === 0){

        workoutList.innerHTML =
        `<p style="color:#9ba8b8">
        No exercises added yet.
        </p>`;

        return;

    }

    workoutList.innerHTML = "";

    workout.forEach(name => {

        const item =
        document.createElement("div");

        item.className =
        "workout-item";

        item.innerHTML = `

        <span>
            ${name}
        </span>

        <button class="remove">
            Remove
        </button>

        `;

        item
        .querySelector(".remove")
        .onclick = () =>
        removeFromWorkout(name);

        workoutList.appendChild(item);

    });

}


/* START */

renderExercises();

renderWorkout();

</script>

</body>
</html>

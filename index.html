<html lang="hi">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitify - Premium Fitness App</title>
<meta name="description" content="Fitify is an exercise and workout library with exercises by muscle group, equipment and difficulty.">

<style>
:root{
  --bg:#0b0f17;
  --card:#161c28;
  --card-hover:#1f283a;
  --text:#f5f7fa;
  --muted:#94a3b8;
  --accent:#00e676;
  --accent-glow:rgba(0, 230, 118, 0.25);
  --line:#263248;
  --danger:#ff4757;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11, 15, 23, 0.85);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}

nav{
  max-width:1150px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:-0.5px;
}

.logo span{
  color:var(--accent);
}

.navlinks{
  display:flex;
  gap:20px;
  font-size:14px;
  font-weight:600;
  color:var(--muted);
}

.navlinks a:hover{
  color:var(--accent);
}

main{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 70px;
}

.hero{
  padding:30px 0 20px;
}

.hero h1{
  font-size:clamp(32px, 6vw, 56px);
  line-height:1.1;
  font-weight:800;
  margin-bottom:12px;
}

.hero h1 span{
  color:var(--accent);
  background: linear-gradient(135deg, #00e676, #00b0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p{
  color:var(--muted);
  max-width:600px;
  line-height:1.6;
  font-size:15px;
}

.searchbox{
  display:flex;
  gap:10px;
  margin-top:24px;
}

.searchbox input{
  flex:1;
  padding:15px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#121722;
  color:white;
  outline:none;
  font-size:15px;
  transition:0.2s;
}

.searchbox input:focus{
  border-color:var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}

button{
  border:0;
  border-radius:12px;
  padding:12px 20px;
  background:var(--accent);
  color:#04140a;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform: translateY(-1px);
  box-shadow: 0 4px 15px var(--accent-glow);
}

.section{
  margin-top:35px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.section-title h2{
  font-size:22px;
  font-weight:700;
}

.muscles{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:12px;
}

.muscle{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 12px;
  cursor:pointer;
  transition:0.2s;
  text-align:center;
}

.muscle:hover, .muscle.active{
  border-color:var(--accent);
  background:var(--card-hover);
  transform:translateY(-3px);
  box-shadow: 0 4px 15px var(--accent-glow);
}

.muscle b{
  display:block;
  margin-bottom:4px;
  font-size:15px;
}

.muscle small{
  color:var(--muted);
  font-size:12px;
}

.exercises{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:18px;
}

.exercise{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  transition:0.3s;
  display:flex;
  flex-direction:column;
}

.exercise:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

.clickable-area {
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.exercise-image{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
  background:#182030;
  transition: 0.3s;
}

.exercise:hover .exercise-image {
  transform: scale(1.04);
}

.image-fallback{
  height:190px;
  background:linear-gradient(135deg,#171c25,#293241);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  font-size:20px;
  font-weight:800;
}

.exercise-body{
  padding:18px;
  flex:1;
  display:flex;
  flex-direction:column;
}

.exercise h3{
  font-size:18px;
  margin-bottom:6px;
  color:var(--text);
  font-weight:700;
}

.play-badge {
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:var(--accent);
  margin-bottom:10px;
  font-weight:700;
  background: var(--accent-glow);
  padding: 4px 8px;
  border-radius: 6px;
  width: fit-content;
}

.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.sets{
  margin-top:10px;
  font-weight:700;
  font-size:13px;
  color:var(--accent);
}

.desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-top:8px;
  flex:1;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.actions button{
  flex:1;
  font-size:13px;
  padding:10px;
  border-radius:10px;
}

.favorite{
  background:#263248;
  color:white;
}

.favorite:hover{
  background:#32425e;
}

.workout-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.workout-item small{
  color:var(--muted);
}

.empty{
  color:var(--muted);
  padding:25px 0;
  text-align:center;
  font-size:15px;
}

footer{
  text-align:center;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding:30px;
  font-size:13px;
}

@media(max-width:650px){
  .exercises{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .exercise-image, .image-fallback{
    height:140px;
  }
  .exercise-body{
    padding:12px;
  }
  .actions{
    flex-direction:column;
  }
}

@media(max-width:420px){
  .exercises{
    grid-template-columns:1fr;
  }
  .exercise-image, .image-fallback{
    height:190px;
  }
}
</style>
</head>
<body>

<nav>

</section>
</main>

<footer>
© 2026 Fitify • Personal Fitness Companion
</footer>

let workout = JSON.parse(localStorage.getItem("fitifyWorkout") || "[]");
let activeGroup = "All";

const groups = [...new Set(exercises.map(e => e.muscle))];

function renderMuscles(){
  document.getElementById("muscles").innerHTML = groups.map(group => {
    const count = exercises.filter(e => e.muscle === group).length;
    const isActive = activeGroup === group ? 'active' : '';
    return `
      <div class="muscle ${isActive}" onclick="filterBy('${group}')">
        <b>${group}</b>
        <small>${count} exercises</small>
      </div>
    `;
  }).join("");
}

function render(list = exercises){
  const container = document.getElementById("exerciseList");

    container.innerHTML = `<div class="empty">Koi exercise nahi mili.</div>`;
    return;
  }

  container.innerHTML = list.map((e) => {
    const originalIndex = exercises.findIndex(ex => ex.name === e.name);
    return `
      <article class="exercise">
        <div class="clickable-area" onclick="openYouTube('${e.name}')" title="Click to watch video tutorial">
          <img 
            class="exercise-image" 
            src="${e.image}" 
            alt="${e.name}" 
            loading="lazy" 
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
          >
          <div class="image-fallback" style="display:none">${e.name}</div>
        </div>

        <div class="exercise-body">
          <div class="clickable-area" onclick="openYouTube('${e.name}')">
            <h3>${e.name}</h3>
            <span class="play-badge">▶ Watch Tutorial</span>
          </div>

          <div class="meta">${e.muscle} • ${e.equipment} • ${e.level}</div>
          <div class="sets">${e.sets}</div>
          <div class="desc">${e.desc}</div>

          <div class="actions">
            <button onclick="addWorkout(${originalIndex})">+ Add</button>
            <button class="favorite" onclick="favorite('${e.name}')">★ Favorite</button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function filterBy(group){
  activeGroup = group;
  renderMuscles();
  document.getElementById("currentCategory").innerText = group + " Exercises";
  const result = exercises.filter(e => e.muscle === group);
  render(result);
  document.getElementById("exercises").scrollIntoView({ behavior:"smooth" });
}

function filterExercises(){
  const q = document.getElementById("search").value.toLowerCase().trim();
  if(!q){
    activeGroup = "All";
    renderMuscles();
    document.getElementById("currentCategory").innerText = "All Exercises";
    render(exercises);
    return;
  }
  const result = exercises.filter(e => 
    e.name.toLowerCase().includes(q) || 
    e.muscle.toLowerCase().includes(q) || 
    e.equipment.toLowerCase().includes(q)
  );
  render(result);
}

function showAll(){
  activeGroup = "All";
  renderMuscles();
  document.getElementById("search").value = "";
  document.getElementById("currentCategory").innerText = "All Exercises";
  render(exercises);
  document.getElementById("exercises").scrollIntoView({ behavior:"smooth" });
}

function openYouTube(exerciseName){
  const query = encodeURIComponent(exerciseName + " exercise tutorial form");
  window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
}

function addWorkout(index){
  const exercise = exercises[index];
  if(!workout.includes(exercise.name)){
    workout.push(exercise.name);
    saveWorkout();
    renderWorkout();
  } else {
    alert(exercise.name + " aapke workout list me pehle se shamil hai.");
  }
}

function removeWorkout(name){
  workout = workout.filter(item => item !== name);
  saveWorkout();
  renderWorkout();
}

function clearWorkout(){
  workout = [];
  saveWorkout();
  renderWorkout();
}

function saveWorkout(){
  localStorage.setItem("fitifyWorkout", JSON.stringify(workout));
}

function renderWorkout(){
  const box = document.getElementById("workoutList");
  if(!workout.length){
    box.innerHTML = `<div class="empty">Aapka workout list khaali hai. Library se exercises add karein.</div>`;
    return;
  }

  box.innerHTML = workout.map(name => {
    const ex = exercises.find(e => e.name === name);
    return `
      <div class="workout-item">
        <div>
          <b>${name}</b><br>
          <small>${ex ? ex.muscle + " • " + ex.sets : ""}</small>
        </div>
        <button onclick="removeWorkout('${name}')" style="background:var(--danger);color:white">Remove</button>
      </div>
    `;
  }).join("");
}

function favorite(name){
  alert(name + " saved as favorite!");
}

renderMuscles();
render();
renderWorkout();
</script>
</body>
</html>

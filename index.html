<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitify - Exercise & Workout</title>

<meta name="description" content="Fitify - Exercise library and workout companion. Explore exercises by muscle group, equipment and difficulty.">
<meta name="theme-color" content="#0b0d10">

<style>
:root{
  --bg:#0b0d10;
  --card:#151922;
  --card2:#1c2230;
  --text:#f5f7fa;
  --muted:#9ca6b5;
  --accent:#65e35d;
  --accent-dark:#42c83d;
  --line:#282f3d;
  --danger:#ff5c5c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,16,.96);
  border-bottom:1px solid var(--line);
}

nav{
  max-width:1100px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:var(--accent);
}

.nav-links{
  display:flex;
  gap:18px;
  color:var(--muted);
  font-size:14px;
}

.nav-links a:hover{
  color:var(--accent);
}

main{
  max-width:1100px;
  margin:auto;
  padding:25px 16px 60px;
}

.hero{
  padding:45px 0 25px;
}

.hero h1{
  font-size:clamp(36px,7vw,62px);
  line-height:1.05;
  margin-bottom:15px;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  color:var(--muted);
  max-width:650px;
  margin-bottom:24px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:40px;
}

.search-box input{
  flex:1;
  padding:15px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  font-size:15px;
  outline:none;
}

.search-box input:focus{
  border-color:var(--accent);
}

button{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  background:var(--accent);
  color:#071007;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:var(--accent-dark);
}

.section{
  margin-top:35px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-title h2{
  font-size:22px;
}

.muscles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
  gap:12px;
}

.muscle{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  cursor:pointer;
  transition:.2s;
}

.muscle:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
}

.muscle b{
  display:block;
  margin-bottom:5px;
}

.muscle small{
  color:var(--muted);
}

.exercises{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.exercise{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  overflow:hidden;
}

.exercise-image{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
  border-radius:11px;
  margin-bottom:12px;
  background:var(--card2);
}

.exercise h3{
  font-size:18px;
  margin-bottom:7px;
}

.exercise p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.exercise .meta{
  color:var(--text);
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
}

.exercise-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.exercise-buttons button{
  font-size:12px;
  padding:9px 12px;
}

.empty{
  grid-column:1/-1;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--line);
  padding:20px;
  border-radius:14px;
}

.workout-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--card);
  border:1px solid var(--line);
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
}

.workout-item span{
  font-weight:700;
}

.remove-btn{
  background:var(--danger);
  color:white;
}

footer{
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  padding:25px 15px;
  font-size:13px;
}

@media(max-width:600px){

  nav{
    padding:12px;
  }

  .nav-links{
    gap:10px;
    font-size:12px;
  }

  main{
    padding:15px 12px 45px;
  }

  .hero{
    padding:35px 0 20px;
  }

  .hero h1{
    font-size:38px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    width:100%;
  }

  .muscles{
    grid-template-columns:repeat(2,1fr);
  }

  .exercises{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .exercise{
    padding:10px;
  }

  .exercise-image{
    height:125px;
  }

  .exercise h3{
    font-size:15px;
  }

  .exercise p,
  .exercise .meta{
    font-size:11px;
  }

  .exercise-buttons{
    flex-direction:column;
  }

  .exercise-buttons button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
<nav>
<a href="#" class="logo">Fit<span>ify</span></a>

<div class="nav-links">
<a href="#exercises">Exercises</a>
<a href="#workout">Workout</a>
</div>
</nav>
</header>

<main>

<section class="hero">

<h1>
Train smarter.<br>
<span>Get stronger.</span>
</h1>

<p>
Explore exercises by muscle group, equipment and difficulty.
Build your personal workout with Fitify.
</p>

<div class="search-box">
<input
id="search"
type="search"
placeholder="Search exercises, e.g. bench press"
oninput="searchExercises()"
>

<button onclick="searchExercises()">Search</button>
</div>

</section>


<section class="section">

<div class="section-title">
<h2>Muscle Groups</h2>
<button onclick="showAll()">All</button>
</div>

<div class="muscles" id="muscles"></div>

</section>


<section class="section" id="exercises">

<div class="section-title">
<h2>Exercise Library</h2>
<button onclick="showAll()">All</button>
</div>

<div class="exercises" id="exerciseList"></div>

</section>


<section class="section" id="workout">

<div class="section-title">
<h2>My Workout</h2>
<button onclick="clearWorkout()">Clear</button>
</div>

<div id="workoutList"></div>

</section>

</main>


<footer>
© 2026 Fitify • Your original exercise & workout companion
</footer>


<script>

/* =========================
   EXERCISE DATA
========================= */

const exercises = [

{
name:"Bench Press",
muscle:"Chest",
equipment:"Barbell",
level:"Intermediate",
sets:"3 × 8–12",
desc:"Press the bar upward with controlled movement.",
image:""
},

{
name:"Push-Up",
muscle:"Chest",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 8–15",
desc:"Keep your body in a straight line and move with control.",
image:"https://raw.githubusercontent.com/mithunsharna01-cmyk/Fitify/main/push-up-4747.jpg"
},

{
name:"Lat Pulldown",
muscle:"Back",
equipment:"Cable",
level:"Beginner",
sets:"3 × 8–12",
desc:"Pull the bar toward your upper chest with control.",
image:""
},

{
name:"Barbell Row",
muscle:"Back",
equipment:"Barbell",
level:"Intermediate",
sets:"3 × 8–12",
desc:"Hinge at the hips and pull the bar toward your torso.",
image:""
},

{
name:"Shoulder Press",
muscle:"Shoulders",
equipment:"Dumbbell",
level:"Intermediate",
sets:"3 × 8–12",
desc:"Press the dumbbells overhead with controlled movement.",
image:""
},

{
name:"Lateral Raise",
muscle:"Shoulders",
equipment:"Dumbbell",
level:"Beginner",
sets:"3 × 12–15",
desc:"Raise the dumbbells out to your sides with control.",
image:""
},

{
name:"Biceps Curl",
muscle:"Biceps",
equipment:"Dumbbell",
level:"Beginner",
sets:"3 × 10–15",
desc:"Curl the weights while keeping your elbows stable.",
image:""
},

{
name:"Triceps Pushdown",
muscle:"Triceps",
equipment:"Cable",
level:"Beginner",
sets:"3 × 10–15",
desc:"Extend your elbows while keeping your upper arms stable.",
image:""
},

{
name:"Goblet Squat",
muscle:"Legs",
equipment:"Dumbbell",
level:"Beginner",
sets:"3 × 8–12",
desc:"Squat while holding a dumbbell close to your chest.",
image:""
},

{
name:"Romanian Deadlift",
muscle:"Legs",
equipment:"Barbell",
level:"Intermediate",
sets:"3 × 8–12",
desc:"Hinge at the hips while maintaining a comfortable neutral back.",
image:""
},

{
name:"Plank",
muscle:"Abs",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 20–60 sec",
desc:"Brace your core and maintain a comfortable straight position.",
image:""
},

{
name:"Calf Raise",
muscle:"Calves",
equipment:"Bodyweight",
level:"Beginner",
sets:"3 × 12–20",
desc:"Rise onto your toes slowly and lower with control.",
image:""
}

];


/* =========================
   WORKOUT STORAGE
========================= */

let workout =
JSON.parse(localStorage.getItem("fitifyWorkout") || "[]");


/* =========================
   MUSCLE GROUPS
========================= */

const groups =
[...new Set(exercises.map(exercise => exercise.muscle))];


function renderMuscles(){

const container =
document.getElementById("muscles");

container.innerHTML = groups.map(group => {

const count =
exercises.filter(exercise => exercise.muscle === group).length;

return `
<div class="muscle" onclick="filterByMuscle('${group}')">
<b>${group}</b>
<small>${count} exercises</small>
</div>
`;

}).join("");

}


/* =========================
   EXERCISE RENDER
========================= */

function renderExercises(list = exercises){

const container =
document.getElementById("exerciseList");

if(!list.length){

container.innerHTML =
`<div class="empty">
No exercises found.
</div>`;

return;

}


container.innerHTML = list.map((exercise,index) => {

const imageHTML =
exercise.image
?
`<img
class="exercise-image"
src="${exercise.image}"
alt="${exercise.name}"
loading="lazy"
onerror="this.style.display='none'"
>`
:
"";


return `

<article class="exercise">

${imageHTML}

<h3>${exercise.name}</h3>

<p>
${exercise.muscle} •
${exercise.equipment} •
${exercise.level}
</p>

<div class="meta">
${exercise.sets}
</div>

<p>
${exercise.desc}
</p>

<div class="exercise-buttons">

<button onclick="addWorkout(${index})">
Add
</button>

<button onclick="favoriteExercise('${exercise.name}')">
Favorite
</button>

</div>

</article>

`;

}).join("");

}


/* =========================
   SEARCH
========================= */

function searchExercises(){

const query =
document.getElementById("search")
.value
.toLowerCase()
.trim();

if(!query){

renderExercises(exercises);
return;

}

const results =
exercises.filter(exercise =>

exercise.name.toLowerCase().includes(query) ||

exercise.muscle.toLowerCase().includes(query) ||

exercise.equipment.toLowerCase().includes(query) ||

exercise.level.toLowerCase().includes(query)

);

renderExercises(results);

}


/* =========================
   MUSCLE FILTER
========================= */

function filterByMuscle(muscle){

const results =
exercises.filter(
exercise => exercise.muscle === muscle
);

renderExercises(results);

document
.getElementById("exercises")
.scrollIntoView({
behavior:"smooth"
});

}


/* =========================
   SHOW ALL
========================= */

function showAll(){

document.getElementById("search").value = "";

renderExercises(exercises);

}


/* =========================
   WORKOUT
========================= */

function addWorkout(index){

const exercise =
exercises[index];

if(!workout.includes(exercise.name)){

workout.push(exercise.name);

saveWorkout();

renderWorkout();

}

}


/* =========================
   SAVE WORKOUT
========================= */

function saveWorkout(){

localStorage.setItem(
"fitifyWorkout",
JSON.stringify(workout)
);

}


/* =========================
   RENDER WORKOUT
========================= */

function renderWorkout(){

const container =
document.getElementById("workoutList");

if(!workout.length){

container.innerHTML =
`<div class="empty">
Your workout is empty. Add exercises from the Exercise Library.
</div>`;

return;

}


container.innerHTML =
workout.map((name,index) => `

<div class="workout-item">

<span>${name}</span>

<button
class="remove-btn"
onclick="removeWorkout(${index})">
Remove
</button>

</div>

`).join("");

}


/* =========================
   REMOVE WORKOUT
========================= */

function removeWorkout(index){

workout.splice(index,1);

saveWorkout();

renderWorkout();

}


/* =========================
   CLEAR WORKOUT
========================= */

function clearWorkout(){

if(!workout.length){
return;
}

workout = [];

saveWorkout();

renderWorkout();

}


/* =========================
   FAVORITE
========================= */

function favoriteExercise(name){

alert(
name + " saved as a favorite."
);

}


/* =========================
   INITIAL LOAD
========================= */

renderMuscles();

renderExercises();

renderWorkout();

</script>

</body>
 </html>
